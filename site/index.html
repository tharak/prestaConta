<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visão geral das receitas, origens dos recursos e despesas declaradas pelos órgãos partidários ao TSE em 2026.">
  <meta name="theme-color" content="#103d46"><title>PrestaConta · Visão dos partidos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23103d46'/%3E%3Cpath d='M9 8h10a6 6 0 010 12h-5v5H9zm5 5v2h5a1 1 0 000-2z' fill='%238be0ca'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./dashboard.css"><script type="module" src="./dashboard.js"></script>
</head>
<body>
  <a class="skip-link" href="#overview">Ir para os gráficos</a>
  <main>
    <section id="overview" class="chart-card card" tabindex="-1" aria-labelledby="chart-title">
      <div class="chart-heading"><h1 id="chart-title">Finanças dos partidos</h1><span class="chart-brand">PrestaConta · Eleições 2026</span></div>
      <div id="load-error" class="error" role="alert" hidden></div>
      <div id="mosaic-view"><div class="metric-switch" role="group" aria-label="Medida representada pela área dos blocos"><button type="button" data-metric="receipts" aria-pressed="true">Receitas declaradas</button><button type="button" data-metric="contracted" aria-pressed="false">Despesas contratadas</button><button type="button" data-metric="paid" aria-pressed="false">Despesas pagas</button></div><div id="mosaic-content"><p class="chart-placeholder">Carregando os órgãos partidários…</p></div></div>
      <div class="party-legend-heading"><h2>Partidos</h2><p id="legend-hint">Clique na sigla para explorar o partido, inclusive blocos pequenos e itens sem área.</p></div>
      <div id="party-legend" class="party-legend" role="group" aria-label="Partidos: explorar no mosaico"></div>
      <div id="chart-detail" class="sr-only" role="status" aria-live="polite">Clique nos blocos para explorar os dados.</div>
      <p class="chart-source"><a href="https://dadosabertos.tse.jus.br/dataset/prestacao-de-contas-eleitorais-2026" target="_blank" rel="noopener noreferrer" title="Movimentação bruta dos órgãos partidários em todo o Brasil, com a última prestação de cada conta. Repasses entre órgãos podem reaparecer como receita.">Fonte: TSE</a><span id="publication-date">Carregando a publicação…</span><button id="reload" class="text-button" type="button">Atualizar</button></p>
    </section>
  </main>
</body>
</html>
